<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Green Ocean — Plants, Planters & Gifts</title>
<meta name="description" content="Healthy nursery-fresh indoor plants, planters and plant gifts from Green Ocean, Balihari, Dhanbad. Pan-India delivery with a 7-day healthy plant guarantee.">
<meta name="theme-color" content="#0C3A28">
<link rel="canonical" href="https://greenocean.co.in/">
<link rel="icon" type="image/png" href="/assets/img/favicon.png?v=589acb91">
<link rel="apple-touch-icon" href="/assets/img/favicon.png?v=589acb91">
<meta property="og:type" content="website"><meta property="og:site_name" content="Green Ocean">
<meta property="og:title" content="Green Ocean — Plants, Planters & Gifts">
<meta property="og:description" content="Nursery-fresh plants delivered across India. 7-day healthy plant guarantee.">
<meta property="og:url" content="https://greenocean.co.in/"><meta property="og:image" content="https://greenocean.co.in/assets/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" as="image" href="/assets/img/hero.jpg?v=5f203695" fetchpriority="high">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --green-900:#0C3A28; --green-800:#0F4632; --green-700:#15563D; --green-500:#2F7D5B;
  --green-100:#E6F1EA; --green-50:#F1F7F3;
  --sand:#F6F2E8; --paper:#FFFFFF; --page:#F7F8F6;
  --ink:#16221C; --muted:#5E6D64; --line:#E2E7E3;
  --orange:#D9622B; --amber:#E9A23B; --red:#C6453A; --blue:#2C6FB5;
  --r-sm:10px; --r:14px; --r-lg:22px; --r-pill:999px;
  --shadow:0 1px 2px rgba(16,40,28,.06), 0 8px 24px rgba(16,40,28,.06);
  --shadow-lg:0 12px 40px rgba(16,40,28,.14);
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --script:'Caveat','Comic Sans MS',cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--page);font-size:15px;line-height:1.55;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button svg,a svg{pointer-events:none}
:focus-visible{outline:2px solid var(--green-500);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:var(--r-pill);
  font-weight:600;font-size:14px;transition:transform .12s ease, background .15s ease, box-shadow .15s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--green-800);color:#fff}
.btn-primary:hover{background:var(--green-700)}
.btn-ghost{background:#fff;color:var(--green-800);border:1.5px solid var(--green-800)}
.btn-ghost:hover{background:var(--green-50)}
.btn-soft{background:var(--green-100);color:var(--green-800)}
.btn-line{border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn-danger{background:#FCECEA;color:var(--red)}
.btn-sq{border-radius:var(--r-sm)}
.btn-sm{padding:7px 12px;font-size:13px}
.btn-lg{padding:14px 24px;font-size:15px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}

/* ---------- Top strip ---------- */
.strip{background:var(--green-900);color:#EAF3ED;font-size:12.5px;height:36px;overflow:hidden;position:relative}
.strip::before,.strip::after{content:'';position:absolute;top:0;bottom:0;width:40px;z-index:2;pointer-events:none}
.strip::before{left:0;background:linear-gradient(90deg,var(--green-900),transparent)}
.strip::after{right:0;background:linear-gradient(270deg,var(--green-900),transparent)}
.strip-track{display:flex;width:max-content;height:36px;align-items:center;animation:stripScroll 32s linear infinite;will-change:transform}
.strip-set{display:flex;align-items:center;justify-content:space-around;gap:56px;padding-right:56px;white-space:nowrap;min-width:100vw}
.strip-set span{display:inline-flex;gap:7px;align-items:center}
.strip-set b{color:#F4C24A;font-weight:700;letter-spacing:.02em}
@media (hover:hover){.strip:hover .strip-track{animation-play-state:paused}}
@keyframes stripScroll{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
@media(max-width:760px){.strip-track{animation-duration:24s}.strip-set{gap:40px;padding-right:40px}}
@media (prefers-reduced-motion:reduce){.strip-track{animation:none!important;width:100%;justify-content:center}
  .strip-set[aria-hidden]{display:none}.strip::before,.strip::after{display:none}}

/* ---------- Header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:#fff;border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:14px;height:62px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-size:21px;font-weight:600;color:var(--green-800);letter-spacing:-.01em}
.logo .leaf{width:26px;height:26px;flex:none}
.nav{display:flex;gap:20px;margin-left:10px}
.nav a{font-size:14px;font-weight:500;color:var(--ink);padding:6px 0;border-bottom:2px solid transparent}
.nav a.on{color:var(--green-700);border-color:var(--green-700)}
.search{flex:1;max-width:380px;margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--green-50);
  border:1px solid var(--line);border-radius:var(--r-pill);padding:8px 14px}
.search input{border:0;background:none;outline:none;width:100%;font-size:13.5px}
.icons{display:flex;align-items:center;gap:6px}
.icon-btn{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--green-800)}
.icon-btn:hover{background:var(--green-50)}
.dot{position:absolute;top:2px;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--orange);
  color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}
.burger,.msearch{display:none}
@media(max-width:940px){.nav,.search{display:none}.burger,.msearch{display:grid}}
.logo{white-space:nowrap}
@media(max-width:430px){.hdr-in{gap:6px}.logo{font-size:18px;gap:6px}.logo .leaf,.logo svg{width:22px;height:22px}.icons{gap:0}.icon-btn{width:34px;height:34px}.usermenu{padding:6px 8px}}
@media(max-width:350px){.wrap{padding:0 10px}.logo{font-size:16px}.icon-btn{width:31px;height:31px}.hdr-in{gap:4px}}
@media(max-width:940px){.hdr .logo img{height:42px!important}}
@media(max-width:430px){.hdr .logo img{height:38px!important}}
@media(max-width:350px){.hdr .logo img{height:34px!important}}

/* ---------- Hero ---------- */
.hero{background:linear-gradient(105deg,#F3EFE3 0%,#F6F2E8 45%,#E9F0E6 100%);border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.hero-in{display:grid;grid-template-columns:1fr 1.05fr;gap:28px;align-items:center;padding:44px 0 40px}
.eyebrow{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--green-500);margin:0 0 12px}
.hero h1{font-family:var(--serif);font-size:clamp(34px,6vw,54px);line-height:1.04;margin:0 0 16px;font-weight:600;letter-spacing:-.02em;color:var(--green-900)}
.hero p{max-width:46ch;color:var(--muted);margin:0 0 22px;font-size:15.5px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-art{position:relative;min-height:280px;border-radius:26px;overflow:hidden}
.script{font-family:var(--script);font-size:26px;color:var(--green-700);line-height:1.15;transform:rotate(-4deg)}
.hero-note{position:absolute;right:6px;top:10px;text-align:center;z-index:3}
@media(max-width:860px){.hero-in{grid-template-columns:1fr;padding:30px 0 28px}.hero-art{min-height:230px}}

/* ---------- Trust bar ---------- */
.trust{background:#fff;border-bottom:1px solid var(--line)}
.trust-in{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px 0}
.trust-i{display:flex;gap:10px;align-items:center}
.trust-i .cc{width:34px;height:34px;border-radius:50%;background:var(--green-100);display:grid;place-items:center;flex:none;color:var(--green-700)}
.trust-i b{display:block;font-size:13.5px;font-weight:600}
.trust-i small{color:var(--muted);font-size:12px}
@media(max-width:760px){.trust-in{grid-template-columns:repeat(2,1fr);gap:14px}}

/* ---------- Sections ---------- */
.sec{padding:34px 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.sec-head h2{font-family:var(--serif);font-size:clamp(21px,3.2vw,27px);margin:0;font-weight:600;letter-spacing:-.01em}
.sec-head p{margin:5px 0 0;color:var(--muted);font-size:14px}
.link-more{font-size:13.5px;font-weight:600;color:var(--green-700);white-space:nowrap}

/* ---------- Category circles ---------- */
.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.cat{text-align:center}
.cat .ring{width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--green-50);border:1px solid var(--line);
  display:grid;place-items:center;transition:transform .15s, box-shadow .15s}
.cat:hover .ring{transform:translateY(-3px);box-shadow:var(--shadow)}
.cat b{display:block;margin-top:9px;font-size:13px;font-weight:600}
@media(max-width:860px){.cats{grid-template-columns:repeat(3,1fr)}}

/* ---------- Product grid ---------- */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
@media(max-width:1000px){.grid,.grid-4{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.grid,.grid-4,.grid-3{grid-template-columns:repeat(2,1fr);gap:11px}}
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;
  transition:box-shadow .15s, transform .15s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.card .ph{position:relative;display:block;aspect-ratio:1;background:var(--green-50);overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;left:8px;top:8px;z-index:2;padding:4px 9px;border-radius:var(--r-pill);font-size:10.5px;font-weight:700;color:#fff;background:var(--green-800)}
.tag.off{background:var(--orange)}
.tag.out{background:#6B7A72}
.wish{position:absolute;right:8px;top:8px;z-index:2;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.94);
  display:grid;place-items:center;color:var(--muted);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.wish.on{color:var(--red)}
.card .bd{padding:10px 11px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.card h3{font-size:14px;margin:0;font-weight:600;line-height:1.3}
.card .sub{font-size:11.5px;color:var(--muted)}
.price{display:flex;align-items:baseline;gap:7px;margin-top:4px}
.price b{font-size:15.5px;font-weight:700}
.price s{font-size:12.5px;color:var(--muted)}
.stars{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted)}
.stars i{color:var(--amber);font-style:normal}
.card .btn{margin-top:9px}

/* ---------- Split promo ---------- */
.promos{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.promo{border-radius:var(--r-lg);padding:24px;min-height:190px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.promo h3{font-family:var(--serif);font-size:24px;margin:0 0 4px;font-weight:600;line-height:1.15}
.promo p{margin:0 0 16px;color:var(--muted);font-size:14px}
.promo .art{position:absolute;right:-10px;bottom:-10px;width:46%;opacity:.95}
.promo-img{border-radius:var(--r-lg);overflow:hidden;display:block;transition:transform .15s,box-shadow .15s}
.promo-img:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.promo-img img{width:100%;height:100%;object-fit:cover}
.promo.pink{background:linear-gradient(120deg,#FBEAE6,#F7DFDA)}
.promo.mint{background:linear-gradient(120deg,#E4F0E4,#D9EBDD)}
@media(max-width:760px){.promos{grid-template-columns:1fr}}

/* ---------- Feature band ---------- */
.band{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center}
.feats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.feat{text-align:center}
.feat .cc{width:38px;height:38px;border-radius:50%;background:var(--green-100);display:grid;place-items:center;margin:0 auto 7px;color:var(--green-700)}
.feat b{font-size:12.5px;display:block;font-weight:600}
.feat small{color:var(--muted);font-size:11.5px}
@media(max-width:860px){.band{grid-template-columns:1fr}}

/* ---------- Spaces ---------- */
.spaces{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.space{position:relative;aspect-ratio:1.25;border-radius:var(--r);overflow:hidden;display:flex;align-items:flex-end;padding:12px;color:#fff}
.space::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.6))}
.space b{position:relative;z-index:2;font-size:13.5px;font-weight:600}
.space img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@media(max-width:860px){.spaces{grid-template-columns:repeat(2,1fr)}}

/* ---------- Testimonials ---------- */
.tcards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px}
.tcard p{margin:0 0 12px;font-size:13.5px;color:var(--ink)}
.who{display:flex;align-items:center;gap:9px}
.av{width:34px;height:34px;border-radius:50%;background:var(--green-100);display:grid;place-items:center;font-weight:700;color:var(--green-700);font-size:13px}
@media(max-width:760px){.tcards{grid-template-columns:1fr}}

/* ---------- Newsletter ---------- */
.news{background:linear-gradient(120deg,var(--green-800),var(--green-700));color:#fff;border-radius:var(--r-lg);padding:26px;
  display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center}
.news h3{font-family:var(--serif);font-size:24px;margin:0 0 6px;font-weight:600}
.news p{margin:0 0 14px;opacity:.85;font-size:14px}
.news form{display:flex;gap:8px}
.news input{flex:1;padding:12px 16px;border-radius:var(--r-pill);border:0;outline:none;font-size:14px;color:var(--ink);background:#fff}
.news input::placeholder{color:#7A8A80}
.news .field .err{color:#FFD9D4}
@media(max-width:760px){.news{grid-template-columns:1fr}}

/* ---------- Footer ---------- */
.ft{background:#E8F1EA;color:#42564B;margin-top:34px;padding:30px 0 0}
.ft-in{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:20px;padding-bottom:22px}
.ft h4{color:#0F4632;font-size:13px;margin:0 0 10px;font-weight:700}
.ft a{display:block;font-size:13px;padding:3px 0;opacity:.85}
.ft a:hover{opacity:1;color:#0F4632}
.ft .soc{display:flex;gap:8px;margin-top:8px}
.ft .soc a{width:32px;height:32px;border-radius:50%;background:rgba(15,70,50,.09);color:#0F4632;display:grid;place-items:center}
.ft-bot{border-top:1px solid rgba(15,70,50,.15);padding:12px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;opacity:.82}
.admin-link{display:inline-flex;align-items:center;gap:7px;border:1.5px solid rgba(15,70,50,.35);color:#0F4632;padding:9px 16px;border-radius:var(--r-sm);font-weight:600;font-size:13px}
@media(max-width:860px){.ft-in{grid-template-columns:1fr 1fr}}

/* ---------- Generic UI ---------- */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--muted)}
.inp{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:var(--r-sm);outline:none;background:#fff;color:var(--ink);font-size:14px}
.inp::placeholder{color:#8A988F}
.inp:focus{border-color:var(--green-500);box-shadow:0 0 0 3px rgba(47,125,91,.12)}
textarea.inp{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inp.bad{border-color:var(--red);background:#FFF8F7}
.inp.good{border-color:#5FA87E}
.err{display:none;color:var(--red);font-size:12px;margin-top:4px;line-height:1.35}
.err.on{display:block}
.hint{color:var(--muted);font-size:11.5px;margin-top:4px;display:block}
.authbox{max-width:420px;margin:0 auto}
.authbox h2{font-family:var(--serif);font-size:24px;margin:0 0 4px;font-weight:600}
.switch{text-align:center;font-size:13.5px;color:var(--muted);margin-top:14px}
.switch a{color:var(--green-700);font-weight:600}
.usermenu{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--green-800);padding:6px 10px;border-radius:var(--r-pill);background:var(--green-50)}
@media(max-width:940px){.usermenu span{display:none}}
@media(max-width:600px){.row2{grid-template-columns:1fr}}
.pill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:var(--r-pill);font-size:11.5px;font-weight:600}
.pill.green{background:#E4F3E9;color:#1F7A4D}.pill.amber{background:#FDF0DC;color:#A5711A}
.pill.blue{background:#E4EFFA;color:#22598F}.pill.red{background:#FBE9E7;color:#B33F34}
.pill.grey{background:#EDF0EE;color:#5E6D64}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:9px 10px;background:var(--green-50);white-space:nowrap}
.tbl td{padding:10px;border-top:1px solid var(--line);vertical-align:middle}
.tbl td:last-child{white-space:nowrap}
.tbl tr:hover td{background:#FAFCFB}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty h3{font-family:var(--serif);color:var(--ink);margin:10px 0 6px}
.thumb{width:42px;height:42px;border-radius:var(--r-sm);object-fit:cover;background:var(--green-50)}

/* ---------- Toast & modal ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:200;display:flex;flex-direction:column;gap:8px;width:max-content;max-width:92vw}
.toast{background:var(--green-900);color:#fff;padding:11px 16px;border-radius:var(--r-pill);font-size:13.5px;box-shadow:var(--shadow-lg);animation:pop .2s ease}
.toast.err{background:var(--red)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.ov{position:fixed;inset:0;background:rgba(10,25,18,.5);z-index:150;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:var(--r-lg);width:100%;max-width:520px;max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.modal-h h3{margin:0;font-family:var(--serif);font-size:19px;font-weight:600}
.modal-b{padding:18px}
.modal-f{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}

/* ---------- Drawer (mobile menu / cart) ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,92vw);background:#fff;z-index:160;display:flex;flex-direction:column;
  box-shadow:var(--shadow-lg);animation:slide .18s ease}
.drawer.left{right:auto;left:0;animation:slideL .18s ease}
@keyframes slide{from{transform:translateX(100%)}}
@keyframes slideL{from{transform:translateX(-100%)}}
.drawer-h{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.drawer-h h3{margin:0;font-family:var(--serif);font-size:18px}
.drawer-b{flex:1;overflow:auto;padding:14px}
.drawer-f{padding:14px;border-top:1px solid var(--line);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}

/* ---------- built-in plant artwork (used until real photos added) ---------- */
const POT={terra:['#D98E62','#C1764C'],white:['#F2F1EC','#DDDBD2'],sage:['#CBD9C8','#B2C4AE'],stone:['#DCD6CB','#C4BDB0'],clay:['#E3A87F','#CE8B63']};
function plantArt(kind,seed){
  const p=POT[(kind&&kind.pot)||'terra']||POT.terra, g1=(kind&&kind.leaf)||'#2F7D5B', g2=(kind&&kind.leaf2)||'#1C5B3F';
  const shape=(kind&&kind.shape)||'bush'; const bg=(kind&&kind.bg)||'#EDF3EC';
  let leaves='';
  if(shape==='blade'){ // snake plant
    for(let i=0;i<7;i++){const x=100+(i-3)*11,h=54+Math.abs(3-i)*-6+42,w=7;
      leaves+=`<path d="M${x} 132 C${x-w} ${132-h*.5} ${x-w*.7} ${132-h*.85} ${x} ${132-h} C${x+w*.7} ${132-h*.85} ${x+w} ${132-h*.5} ${x} 132Z" fill="${i%2?g1:g2}"/>`;}
  } else if(shape==='vine'){ // money plant
    for(let i=0;i<9;i++){const a=(i/8)*Math.PI*1.6-2.5,r=46+(i%3)*13,x=100+Math.cos(a)*r,y=104+Math.sin(a)*r*.62;
      leaves+=`<path d="M100 116 Q${(100+x)/2} ${(116+y)/2-8} ${x} ${y}" stroke="${g2}" stroke-width="2.4" fill="none"/>
      <path d="M${x} ${y} c-11-9-11-19 0-23 11 4 11 14 0 23Z" fill="${i%2?g1:g2}" transform="rotate(${a*57+90} ${x} ${y})"/>`;}
  } else if(shape==='lily'){
    for(let i=0;i<6;i++){const x=100+(i-2.5)*15,h=66+((i%2)?10:0);
      leaves+=`<path d="M100 134 Q${x} ${134-h*.7} ${x} ${134-h} Q${x+10} ${134-h*.5} 100 134Z" fill="${i%2?g1:g2}"/>`;}
    leaves+=`<ellipse cx="100" cy="56" rx="11" ry="17" fill="#FBFAF4"/><ellipse cx="118" cy="66" rx="9" ry="14" fill="#FBFAF4"/>`;
  } else if(shape==='aloe'){
    for(let i=0;i<7;i++){const a=(i-3)*17,x=100+a*1.4;
      leaves+=`<path d="M100 136 Q${x*1.02} 96 ${x+(a>0?16:-16)} ${58+Math.abs(a)*.5} Q${x} 96 100 136Z" fill="${i%2?g1:g2}"/>`;}
  } else if(shape==='zz'){
    for(let s=-1;s<=1;s+=2){for(let i=0;i<5;i++){const y=124-i*17,x=100+s*(12+i*7);
      leaves+=`<ellipse cx="${x}" cy="${y}" rx="13" ry="9" fill="${i%2?g1:g2}" transform="rotate(${s*32} ${x} ${y})"/>`;}}
    leaves+=`<path d="M100 136 Q88 96 84 60M100 136 Q112 96 116 60" stroke="${g2}" stroke-width="3" fill="none"/>`;
  } else if(shape==='succulent'){
    for(let r=3;r>=1;r--){const n=r*4,rad=r*17;
      for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2,x=100+Math.cos(a)*rad*.8,y=108+Math.sin(a)*rad*.5;
        leaves+=`<ellipse cx="${x}" cy="${y}" rx="12" ry="8" fill="${r%2?g1:g2}" transform="rotate(${a*57} ${x} ${y})"/>`;}}
  } else if(shape==='flower'){
    leaves+=`<path d="M100 140 V92" stroke="${g2}" stroke-width="3"/>`;
    for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2,x=100+Math.cos(a)*24,y=78+Math.sin(a)*24;
      leaves+=`<ellipse cx="${x}" cy="${y}" rx="13" ry="9" fill="${(kind&&kind.flower)||'#E4707F'}" transform="rotate(${a*57} ${x} ${y})"/>`;}
    leaves+=`<circle cx="100" cy="78" r="10" fill="#F4C24A"/>
    <path d="M100 118c-16-4-22-14-22-14s14-4 22 8M100 112c14-4 20-13 20-13s-13-4-20 7" fill="${g1}"/>`;
  } else {
    for(let i=0;i<9;i++){const a=(i/8)*Math.PI-Math.PI,x=100+Math.cos(a)*40,y=104+Math.sin(a)*34;
      leaves+=`<ellipse cx="${x}" cy="${y}" rx="17" ry="11" fill="${i%2?g1:g2}" transform="rotate(${a*57+90} ${x} ${y})"/>`;}
    leaves+=`<circle cx="100" cy="92" r="20" fill="${g1}"/>`;
  }
  const potTop=(kind&&kind.potTop)||136;
  return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <rect width="200" height="200" fill="${bg}"/>
  <circle cx="100" cy="104" r="76" fill="rgba(255,255,255,.55)"/>
  ${leaves}
  <path d="M${100-34} ${potTop} h68 l-9 42 a6 6 0 0 1-6 5 h-38 a6 6 0 0 1-6-5 Z" fill="${p[0]}"/>
  <path d="M${100-38} ${potTop-8} h76 a4 4 0 0 1 4 4 v5 a4 4 0 0 1-4 4 h-76 a4 4 0 0 1-4-4 v-5 a4 4 0 0 1 4-4Z" fill="${p[1]}"/>
  <ellipse cx="100" cy="188" rx="46" ry="6" fill="rgba(20,60,40,.10)"/></svg>`;
}

  succulent:{shape:'succulent',pot:'sage',leaf:'#7FAE74',leaf2:'#4E8455',bg:'#F1F4EA'},
  flower:{shape:'flower',pot:'clay',leaf:'#4E9B5F',leaf2:'#2C6E45',flower:'#E4707F',bg:'#FBF0EE'},

}

<script>
/* ================= LIVE SERVER (Cloudflare Worker) ================= */
const PUB_KEYS=['products','categories','banners','coupons','blogs','pages'];
const API={on:false,key:null,storeMissing:false,lastPub:'',timer:null,status:'local',err:'',inboxAt:0,pendingReviews:[],messages:[],health:null,applying:false,
  async call(path,opt={}){
    const o={method:opt.method||'GET',headers:{'content-type':'application/json'},cache:'no-store'};
    if(opt.admin&&API.key)o.headers['x-admin-key']=API.key;
    if(opt.body!==undefined)o.body=JSON.stringify(opt.body);
    const ctrl=new AbortController(), t=setTimeout(()=>ctrl.abort(),opt.timeout||15000); o.signal=ctrl.signal;
    try{
      const r=await fetch(path,o); let j={};
      try{ j=await r.json(); }catch(e){ j={error:'The server gave an unexpected reply.'}; }
      j.status=r.status; j.ok=r.ok&&j.ok!==false; if(!j.ok&&!j.error)j.error='Request failed ('+r.status+')';
      return j;
    }catch(e){ return {ok:false,offline:true,error:'Could not reach our server. Please check your internet and try again.'}; }
    finally{ clearTimeout(t); }
  },
  async init(){
    if(!/^https?:$/.test(location.protocol))return;
    const s=await API.call('/api/store',{timeout:8000});          // one request: data + server status
    if(!s.ok)return;                                               // no server → site keeps working as before
    API.on=true; API.health={mail:s.mail,admin:s.admin};
    try{ API.key=sessionStorage.getItem('go_admin_key'); }catch(e){}
    const wasAdmin=DB.admin; if(DB.admin&&!API.key){ DB.admin=false; save(); }
    let changed=wasAdmin!==DB.admin;
    if(s.store&&Array.isArray(s.store.products)){
      if(s.v!==DB.storeVer){ applyStore(s.store); DB.storeVer=s.v; save(); changed=true; }
    } else API.storeMissing=true;
    API.lastPub=API.storeMissing?'':pubString();
    API.status=API.storeMissing?'unpublished':'live';
    if(changed||location.hash.startsWith('#/admin')||/contact/.test(location.hash))softRepaint(true);
    API.watch();
  },
  /* keep every open page in step with the admin panel, without a refresh */
  watch(){
    const tick=async()=>{
      if(document.visibilityState!=='visible'||DB.admin)return;
      if(API.checking){ API.recheck=true; return; }
      API.checking=true; API.recheck=false;
      try{
        const r=await API.call('/api/version',{timeout:6000});
        if(r.ok&&r.v&&r.v!==DB.storeVer){
          const s=await API.call('/api/store');
          if(s.ok&&s.store&&Array.isArray(s.store.products)){ applyStore(s.store); DB.storeVer=s.v; save(); softRepaint(); }
        }
      } finally { API.checking=false; if(API.recheck){ API.recheck=false; setTimeout(tick,300); } }
    };
    setInterval(tick,15000);
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible')tick(); });
    window.addEventListener('focus',tick);
  }
};
/* repaint in place: keep the scroll position, never interrupt someone typing or a popup */
let REPAINT_WAITING=false, FORM_DIRTY=false;
document.addEventListener('input',e=>{ if(e.target&&e.target.closest&&e.target.closest('#root form'))FORM_DIRTY=true; });
function softRepaint(force){
  if(FORM_DIRTY&&!force)return;          // someone is filling a form — new data shows on their next page
  const busy=document.querySelector('#layer .ov,#layer .drawer')||(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&document.activeElement.closest('#root form'));
  if(busy&&!force){ if(!REPAINT_WAITING){ REPAINT_WAITING=true; const again=()=>{ REPAINT_WAITING=false; softRepaint(); };
      document.addEventListener('focusout',()=>setTimeout(again,300),{once:true}); } return; }
  const y=window.scrollY; paint(); window.scrollTo(0,y);
}

function readImage(file,done){
  if(!file||!/^image\//.test(file.type)){toast('Please choose a photo file',true);return;}
  const fr=new FileReader();
  fr.onload=()=>{ const img=new Image(); img.onload=()=>{
      const max=1000, sc=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas'); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
      const cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(img,0,0,cv.width,cv.height);
      done(cv.toDataURL('image/jpeg',0.82)); };
    img.onerror=()=>toast('That photo could not be read',true); img.src=fr.result; };
  fr.readAsDataURL(file);
}

<script>

const RULES={
  name:v=>/^[A-Za-z][A-Za-z .']{1,39}$/.test(v.trim())||'Use letters only, at least 2 characters',
  email:v=>/^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}$/.test(v.trim())||'Enter a working email, like name@gmail.com',
  phone:v=>/^[6-9][0-9]{9}$/.test(v.replace(/[^0-9]/g,''))||'10-digit Indian mobile number starting with 6, 7, 8 or 9',
  pin:v=>/^[1-9][0-9]{5}$/.test(v.trim())||'Enter a valid 6-digit pincode',
  address:v=>v.trim().length>=10||'House, street and area — at least 10 characters',
  city:v=>/^[A-Za-z][A-Za-z .-]{1,39}$/.test(v.trim())||'City name in letters',
  pass:v=>/^(?=.*[A-Za-z])(?=.*[0-9]).{6,}$/.test(v)||'At least 6 characters with one letter and one number',
  login:v=>/^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}$/.test(v.trim())||/^[6-9][0-9]{9}$/.test(v.replace(/[^0-9]/g,''))||'Enter your email address or 10-digit mobile number',
  text:v=>v.trim().length>=3||'Too short — write a little more',
  msg:v=>v.trim().length>=10||'Write at least 10 characters so we can help',
  price:v=>(+v>0&&+v<1000000)||'Enter an amount above 0',
  num:v=>(v!==''&&+v>=0&&Number.isInteger(+v))||'Whole numbers only',
  code:v=>/^[A-Za-z0-9]{4,15}$/.test(v.trim())||'4–15 letters or numbers, no spaces',
  slug:v=>v.trim()===''||/^[A-Za-z0-9 -]{2,40}$/.test(v.trim())||'Letters, numbers and dashes only',
  any:v=>v.trim().length>0||'This cannot be left empty',
  agree:()=>true,
  url:v=>v.trim()===''||/^https?:\/\/[^\s]+\.[^\s]{2,}$/.test(v.trim())||'Paste the full link starting with https://'
};

  const rule=RULES[inp.dataset.v]; if(!rule)return '';
  const v=inp.value==null?'':inp.value;
  if(!v.trim())return OPTIONAL[inp.dataset.v]?'':(inp.dataset.label?(inp.dataset.label+' is needed'):'This is needed');
  const r=rule(v); return r===true?'':r;
}
function markField(inp){
  const msg=fieldError(inp);
  const host=inp.type==='checkbox'?inp.closest('.field'):inp.parentElement;
  let slot=host.querySelector('.err');
  if(!slot){slot=document.createElement('span');slot.className='err';host.appendChild(slot);}
  slot.textContent=msg; slot.classList.toggle('on',!!msg);
  inp.classList.toggle('bad',!!msg);
  if(inp.type!=='checkbox')inp.classList.toggle('good',!msg&&!!inp.value.trim());
  return !msg;
}
function validateForm(form){
  const list=[...form.querySelectorAll('[data-v]')];
  let first=null, allOk=true;
  list.forEach(i=>{ if(!markField(i)){allOk=false; if(!first)first=i;} });
  const p1=form.querySelector('[name="pass"]'), p2=form.querySelector('[name="pass2"]');
  if(p1&&p2&&p1.value!==p2.value){
    let slot=p2.parentElement.querySelector('.err');
    if(!slot){slot=document.createElement('span');slot.className='err';p2.parentElement.appendChild(slot);}
    slot.textContent='Both passwords must match'; slot.classList.add('on'); p2.classList.add('bad');
    allOk=false; if(!first)first=p2;
  }
  if(first){first.focus(); first.scrollIntoView({block:'center',behavior:'smooth'}); toast('Please fix the highlighted fields',true);}
  return allOk;
}

  const i=e.target; if(!i||!i.dataset||!i.dataset.v)return;

function sitemapXML(domain){
  const base=String(domain||'').trim().replace(/\/+$/,'');
  const paths=['/','/shop','/cart','/wishlist','/login','/signup','/orders','/account','/blog','/sitemap']
    .concat(DB.categories.map(c=>'/shop?cat='+c.id))

    .concat(DB.blogs.filter(b=>b.active).map(b=>'/blog/'+b.id))
    .concat(DB.pages.filter(p=>p.active).map(p=>'/page/'+p.slug));
  const d=today();
  return `<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
${paths.map(u=>`  <url>
    <loc>${base}/#${u}</loc>
    <lastmod>${d}</lastmod>
    <changefreq>weekly</changefreq>
  </url>`).join('\n')}
</urlset>`;
}

function viewShop(q){
  const params=new URLSearchParams(q||'');
  const catId=params.get('cat')||'', term=(params.get('q')||'').toLowerCase(), sort=params.get('sort')||'pop', max=+(params.get('max')||0);
  let list=DB.products.filter(p=>p.active);
  if(catId)list=list.filter(p=>p.cat===catId);
  if(term)list=list.filter(p=>(p.name+' '+p.sub+' '+p.desc).toLowerCase().includes(term));
  if(max)list=list.filter(p=>p.price<=max);
  if(sort==='low')list=[...list].sort((a,b)=>a.price-b.price);
  if(sort==='high')list=[...list].sort((a,b)=>b.price-a.price);

function waNumber(){ const n=(DB.settings.phone||'').replace(/[^0-9]/g,''); return n.length===10?'91'+n:n; }
function orderWhatsAppLink(o){
  const lines=[`New order from ${location.host||'greenocean.co.in'}`,`Order #${o.id}`,'',
    `Name: ${o.name}`,`Mobile: ${o.phone}`,`Email: ${o.email}`,`Address: ${o.address}`,'','Items:']
    .concat(o.items.map(i=>`• ${i.name} × ${i.qty} = ₹${(i.price*i.qty).toLocaleString('en-IN')}`))
    .concat(['',`Total to pay: ₹${Number(o.total).toLocaleString('en-IN')}`,`Payment preference: ${o.pay}`]);
  if(o.coupon)lines.push(`Coupon used: ${o.coupon}`);
  if(o.note)lines.push(`Gift note: ${o.note}`);
  return 'https://wa.me/'+waNumber()+'?text='+encodeURIComponent(lines.join('\n'));
}
function placeOrder(f,server){
  const d=Object.fromEntries(new FormData(f).entries());
  const sub=cartSubtotal(), s=DB.settings;
  const c=DB.coupon&&DB.coupons.find(k=>k.code===DB.coupon&&k.active);
  let off=0, ship=sub>=s.freeShipAbove?0:s.shipFee;
  if(c){ if(c.type==='percent')off=Math.round(sub*c.value/100); if(c.type==='ship')ship=0; }
  const items=DB.cart.map(l=>{const p=prod(l.id);return{id:p.id,name:p.name,price:p.price,qty:l.qty,art:p.art,img:p.img};});
  items.forEach(i=>{const p=prod(i.id); if(p)p.stock=Math.max(0,p.stock-i.qty);});
  const id=server&&server.id?server.id:String(DB.counter++);
  if(server&&server.total!=null){ off=server.discount||0; ship=server.delivery||0; }
  DB.orders.unshift({id,name:d.name,phone:d.phone,email:d.email,address:d.address+', '+d.city+' '+d.pin,
    mailed:!!(server&&server.customerMailed),
    items,total:server&&server.total!=null?server.total:sub-off+ship,pay:d.pay||'COD',status:'Processing',date:today(),note:d.note||'',coupon:c?c.code:'',
    via:DB.settings.orderMode==='whatsapp'?'WhatsApp':'Website'});
  let cust=DB.customers.find(x=>x.email===d.email);
  if(cust){cust.orders++;cust.spent+=sub-off+ship;}
  else DB.customers.unshift({id:uid('u'),name:d.name,email:d.email,phone:d.phone,city:d.city,orders:1,spent:sub-off+ship,joined:today()});
  const acct=DB.session&&DB.session.id?(DB.users||[]).find(u=>u.id===DB.session.id):null;
  if(acct){ Object.assign(acct,{phone:d.phone,address:d.address,city:d.city,pin:d.pin}); signIn(acct); }
  else DB.session={name:d.name,email:d.email,phone:d.phone,address:d.address,city:d.city,pin:d.pin};
  DB.cart=[]; DB.coupon=''; save(); go('#/thanks/'+id); return id;
}
function viewThanks(id){

let DASH_RANGE=30;
function dayKey(d){ return d.toISOString().slice(0,10); }
function dashStats(R){
  const now=new Date(), start=new Date(now), prevStart=new Date(now);
  start.setDate(now.getDate()-R+1); prevStart.setDate(now.getDate()-2*R+1);
  const live=DB.orders.filter(o=>o.status!=='Cancelled');
  const inR=o=>o.date>=dayKey(start), inPrev=o=>o.date>=dayKey(prevStart)&&o.date<dayKey(start);
  const cur=DB.orders.filter(inR), prev=DB.orders.filter(inPrev);
  const buckets=R>90?12:Math.min(R,15), step=R/buckets, series=[], labels=[];
  for(let i=0;i<buckets;i++){
    const a=new Date(start); a.setDate(start.getDate()+Math.round(i*step));
    const b=new Date(start); b.setDate(start.getDate()+Math.round((i+1)*step));
    series.push(live.filter(o=>o.date>=dayKey(a)&&o.date<dayKey(b)).reduce((x,o)=>x+o.total,0));
  }
  const fmt=d=>d.toLocaleDateString('en-IN',R>90?{month:'short'}:{day:'2-digit',month:'short'});
  for(let i=0;i<5;i++){const d=new Date(start); d.setDate(start.getDate()+Math.round(i*(R-1)/4)); labels.push(fmt(d));}
  return {orders:cur.length, prevOrders:prev.length,
    revenue:cur.filter(o=>o.status!=='Cancelled').reduce((x,o)=>x+o.total,0),
    prevRevenue:prev.filter(o=>o.status!=='Cancelled').reduce((x,o)=>x+o.total,0),
    newCustomers:DB.customers.filter(c=>c.joined>=dayKey(start)).length, series, labels};
}
function lineChart(vals,w,h){
  if(vals.length<2)vals=[vals[0]||0,vals[0]||0];
  const max=Math.max(1,...vals)*1.15, step=w/(vals.length-1);
  const pts=vals.map((v,i)=>[i*step,h-(v/max)*h]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="display:block">
   <defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F7D5B" stop-opacity=".28"/><stop offset="1" stop-color="#2F7D5B" stop-opacity="0"/></linearGradient></defs>
   ${[0,1,2,3].map(i=>`<line x1="0" y1="${h*i/3}" x2="${w}" y2="${h*i/3}" stroke="#E2E7E3" stroke-width="1"/>`).join('')}
   <path d="${d} L ${w} ${h} L 0 ${h} Z" fill="url(#fill)"/>
   <path d="${d}" fill="none" stroke="#2F7D5B" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
   ${pts.filter((_,i)=>i%2===0).map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="#15563D"/>`).join('')}</svg>`;
}
function admDashboard(){
  const R=DASH_RANGE, st=dashStats(R);
  const trend=(a,b)=>b>0?`${a>=b?'↑':'↓'} ${Math.abs(Math.round((a-b)/b*100))}% vs previous ${R} days`:(a>0?'New this period':'No activity yet');
  const kpis=[['bag','Total Orders',st.orders.toLocaleString('en-IN'),trend(st.orders,st.prevOrders),'#E4F0FB','#2C6FB5'],
    ['wallet','Total Revenue',money(st.revenue),trend(st.revenue,st.prevRevenue),'#FDF1DE','#C88A22'],
    ['users','Total Customers',DB.customers.length.toLocaleString('en-IN'),st.newCustomers+' new in last '+R+' days','#E8F1EA','#1F7A4D'],
    ['box','Total Products',DB.products.length,DB.products.filter(p=>p.active).length+' live · '+DB.products.filter(p=>p.stock<6).length+' low stock','#F6E9F1','#A6457E']];

<script>

     <td>${esc((cat(p.cat)||{}).name||'—')}</td><td>${money(p.price)}${p.mrp>p.price?`<br><small style="color:var(--muted)"><s>${money(p.mrp)}</s></small>`:''}</td>
     <td>${p.stock<6?`<span class="pill red">${p.stock} left</span>`:p.stock}</td>
     <td><span class="pill ${p.active?'green':'grey'}">${p.active?'Active':'Hidden'}</span></td>

       <button class="btn btn-sm btn-danger btn-sq" data-del-product="${p.id}">${ic('trash',14)}</button></td></tr>`).join('')||
     `<tr><td colspan="7"><div class="empty">No products match that search.</div></td></tr>`}</tbody></table></div></div>`,

   `<button class="btn btn-primary btn-sq" data-edit-product="new">${ic('plus',15)} Add New Product</button>`);
}
function productForm(id){
  const p=id==='new'?{id:'',name:'',sub:'',cat:DB.categories[0].id,price:'',mrp:'',stock:10,art:'bush',img:'',desc:'',active:true,rating:4.5,reviews:0,badge:'',care:{light:'Bright indirect',water:'Weekly',pet:'Keep away from pets'}}:prod(id);
  if(!p)return;
  openModal(id==='new'?'Add new product':'Edit product',`<form id="pForm" novalidate>
    <div class="field"><label>Product name</label><input class="inp" name="name" data-v="name" data-label="Product name" value="${esc(p.name)}"></div>
    <div class="row2"><div class="field"><label>Short line</label><input class="inp" name="sub" value="${esc(p.sub||'')}" placeholder="Air purifying"></div>
      <div class="field"><label>Category</label><select class="inp" name="cat">${DB.categories.map(c=>`<option value="${c.id}" ${p.cat===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div>
    <div class="row2"><div class="field"><label>Selling price (₹)</label><input class="inp" type="number" name="price" data-v="price" data-label="Price" min="1" value="${p.price}"></div>
      <div class="field"><label>MRP (₹)</label><input class="inp" type="number" name="mrp" min="0" value="${p.mrp||''}"></div></div>
    <div class="row2"><div class="field"><label>Stock</label><input class="inp" type="number" name="stock" data-v="num" data-label="Stock" min="0" value="${p.stock}"></div>
      <div class="field"><label>Badge</label><input class="inp" name="badge" value="${esc(p.badge||'')}" placeholder="Bestseller / New"></div></div>
    <div class="field"><label>Description</label><textarea class="inp" name="desc" data-v="text" data-label="Description">${esc(p.desc||'')}</textarea></div>
    <div class="row2"><div class="field"><label>Light</label><input class="inp" name="light" value="${esc(p.care.light)}"></div>
      <div class="field"><label>Water</label><input class="inp" name="water" value="${esc(p.care.water)}"></div></div>
    <div class="field"><label>Pet note</label><input class="inp" name="pet" value="${esc(p.care.pet)}"></div>
    <div class="field"><label>Photo</label>
      <div style="display:flex;gap:10px;align-items:center">${pic(p,'thumb')}
        <input class="inp" type="file" accept="image/*" id="pFile"></div>
      <small style="color:var(--muted);font-size:11.5px">Upload your own photo, or leave it to keep the current one.</small></div>
    <label style="display:flex;gap:8px;align-items:center;font-size:13.5px"><input type="checkbox" name="active" ${p.active?'checked':''}> Show on website</label>
    <input type="hidden" name="id" value="${esc(p.id)}"></form>`,
    `<button class="btn btn-line btn-sq" data-close="1">Cancel</button><button class="btn btn-primary btn-sq" id="pSave">${id==='new'?'Add product':'Save changes'}</button>`);
  let newImg=null;
  $('#pFile').onchange=e=>{const f=e.target.files[0]; if(!f)return; readImage(f,u=>{newImg=u;toast('Photo ready — press save');});};
  $('#pSave').onclick=()=>{
    const f=$('#pForm'); if(!validateForm(f))return;
    const d=Object.fromEntries(new FormData(f).entries());
    const obj={id:d.id||uid('p'),name:d.name,sub:d.sub,cat:d.cat,price:+d.price,mrp:+d.mrp||+d.price,stock:+d.stock,
      badge:d.badge,desc:d.desc,active:!!d.active,art:p.art||'bush',img:newImg||p.img||'',
      rating:p.rating||4.5,reviews:p.reviews||0,care:{light:d.light,water:d.water,pet:d.pet}};
    if(d.id){Object.assign(prod(d.id),obj);} else DB.products.unshift(obj);
    save(); closeLayer(); paint(); toast(d.id?'Product updated':'Product added');
  };
}

function catForm(id){
  const c=id==='new'?{id:'',name:'',slug:'',desc:'',art:'bush',img:''}:cat(id); if(!c)return;
  openModal(id==='new'?'Add category':'Edit category',`<form id="cForm" novalidate>
    <div class="field"><label>Name</label><input class="inp" name="name" data-v="name" data-label="Category name" value="${esc(c.name)}"></div>
    <div class="field"><label>Short description</label><input class="inp" name="desc" value="${esc(c.desc||'')}"></div>

    <input type="hidden" name="id" value="${esc(c.id)}"></form>`,
    `<button class="btn btn-line btn-sq" data-close="1">Cancel</button><button class="btn btn-primary btn-sq" id="cSave">Save</button>`);
  let ni=null; $('#cFile').onchange=e=>{const f=e.target.files[0];if(!f)return;readImage(f,u=>{ni=u;toast('Photo ready — press save');});};
  $('#cSave').onclick=()=>{const f=$('#cForm'); if(!validateForm(f))return;
    const d=Object.fromEntries(new FormData(f).entries());
    const obj={id:d.id||uid('c'),name:d.name,desc:d.desc,slug:d.name.toLowerCase().replace(/\W+/g,'-'),art:c.art||'bush',img:ni||c.img||''};

         <span>${esc(c.name)}</span><b>${c.n}</b></div><div class="bar"><i style="width:${Math.round(c.n/maxN*100)}%"></i></div></div>`).join('')}</div></div>
   <div class="panel" style="margin-top:16px"><div class="card-h"><h3>Most reviewed products</h3></div>
     <div class="scroll-x"><table class="tbl"><thead><tr><th>Product</th><th>Price</th><th>Rating</th><th>Reviews</th><th>Stock</th></tr></thead>
     <tbody>${top.map(p=>`<tr><td style="display:flex;gap:8px;align-items:center">${pic(p,'thumb')} ${esc(p.name)}</td>
       <td>${money(p.price)}</td><td><span class="stars">${stars(p.rating)}</span></td><td>${p.reviews}</td><td>${p.stock}</td></tr>`).join('')}</tbody></table></div></div>`,
   'Reports','Numbers from the orders sitting in this store.',
   `<button class="btn btn-line btn-sq" data-act="exportOrders">${ic('doc',15)} Export orders CSV</button>`);
}
function admAccount(){
  const s=DB.settings;
  if(API.on)return adminShell('account',`<div class="panel" style="max-width:560px">
    <div class="card-h"><h3>Admin password</h3></div>
    <p style="font-size:13.5px;margin:0 0 10px">On the live website, the admin password is kept safely on the server — not in this page — so nobody can read it.</p>
    <p style="font-size:13.5px;margin:0 0 6px"><b>To change it:</b> Cloudflare → Workers & Pages → greenocean → Settings → Variables and Secrets → <b>ADMIN_PASSWORD</b> → Edit.</p>
    <p style="font-size:13px;color:var(--muted);margin:0">After changing it, sign in here again with the new password.</p></div>`,'Settings','Who can get into this panel.');
  return adminShell('account',`<form id="accForm" class="panel" style="max-width:520px" novalidate>

    <p style="font-size:12px;color:var(--muted);margin:0 0 12px">Change these before you share the link with anyone.</p>

   'Settings','Who can get into this panel.');

<script>
/* ================= ROUTER ================= */
function route(){
  const h=location.hash.replace(/^#/,'')||'/';
  const [path,query]=h.split('?');
  const seg=path.split('/').filter(Boolean);
  return {seg,query:query||'',path};
}
function paint(){
  const {seg,query}=route();
  const root=$('#root'); let html='';
  if(seg[0]==='admin'){
    if(!DB.admin){html=adminLogin();}
    else{
      const page=seg[1]||'dashboard';
      const map={dashboard:admDashboard,products:()=>admProducts(query),categories:admCategories,orders:()=>admOrders(query),
        customers:admCustomers,inventory:admInventory,banners:admBanners,offers:admOffers,blog:admBlog,reviews:admReviews,
        pages:admPages,newsletter:admNewsletter,messages:admMessages,settings:admSettings,appearance:admAppearance,reports:admReports,account:admAccount};
      html=(map[page]||admDashboard)();
    }
  } else {
    switch(seg[0]){
      case undefined: html=viewHome(); break;
      case 'shop': html=viewShop(query); break;
      case 'product': html=viewProduct(seg[1]); break;
      case 'cart': html=viewCart(); break;
      case 'wishlist': html=viewWishlist(); break;
      case 'checkout': html=viewCheckout(); break;
      case 'thanks': html=viewThanks(seg[1]); break;
      case 'orders': html=viewOrders(); break;
      case 'account': html=viewAccount(); break;
      case 'login': html=DB.session?viewAccount():viewLogin(); break;
      case 'signup': html=DB.session?viewAccount():viewSignup(); break;
      case 'page': html=viewPage(seg[1]); break;
      case 'blog': html=viewBlog(seg[1]); break;
      case 'sitemap': html=viewSitemap(); break;
      default: html=viewHome();
    }
  }
  root.innerHTML=html;
  document.documentElement.style.setProperty('--green-800',DB.settings.theme||'#0F4632');
  document.title=DB.settings.metaTitle||DB.settings.store;
  if(seg[0]==='admin'&&DB.admin&&query.includes('new=1')){
    const p=seg[1];
    if(p==='products')productForm('new'); if(p==='offers')couponForm('new'); if(p==='banners')bannerForm('new');
  }
  const q=(new URLSearchParams(query)).get('q');
  if(q){const i=document.querySelector('.search input'); if(i)i.value=q;}
  if(seg[0]==='admin'&&DB.admin&&API.on)loadInbox(false);
}
let NAV_DEPTH=0;
window.addEventListener('hashchange',()=>{NAV_DEPTH++;FORM_DIRTY=false;closeLayer();window.scrollTo(0,0);paint();});

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
  if(e.target.classList&&e.target.classList.contains('ov')){closeLayer();return;}
  const t=e.target.closest('[data-close]:not(.ov),[data-add],[data-buy],[data-wish],[data-qty],[data-rm],[data-link],[data-act],[data-edit-product],[data-del-product],[data-toggle-product],[data-edit-cat],[data-del-cat],[data-view-order],[data-advance],[data-cancel-admin],[data-cancel],[data-reorder],[data-view-cust],[data-stock-save],[data-edit-banner],[data-del-banner],[data-toggle-banner],[data-edit-coupon],[data-del-coupon],[data-toggle-coupon],[data-edit-blog],[data-del-blog],[data-edit-page],[data-del-page],[data-pub-review],[data-hide-review],[data-del-review],[data-del-sub],[data-brand],[data-msg-read],[data-msg-del]');
  if(!t)return;
  const d=t.dataset;
  if(d.close!==undefined){closeLayer(); if(t.tagName!=='A')return; return;}
  if(d.add){e.preventDefault();addToCart(d.add);return;}
  if(d.buy){e.preventDefault();addToCart(d.buy);closeLayer();go('#/checkout');return;}
  if(d.wish){e.preventDefault();toggleWish(d.wish);return;}
  if(d.qty){e.preventDefault();const l=DB.cart.find(i=>i.id===d.qty);setQty(d.qty,l.qty+(+d.d));if($('.drawer'))openCart();return;}
  if(d.rm){e.preventDefault();setQty(d.rm,0);if($('.drawer'))openCart();return;}
  if(d.link){e.preventDefault();closeLayer();go(d.link);return;}
  if(d.cancel){confirmBox('Cancel order #'+d.cancel+'? This cannot be undone.',()=>{
    const o=DB.orders.find(x=>x.id===d.cancel); if(o){o.status='Cancelled';o.items.forEach(i=>{const p=prod(i.id);if(p)p.stock+=i.qty;});}
    save();paint();toast('Order cancelled');});return;}
  if(d.reorder){const o=DB.orders.find(x=>x.id===d.reorder);
    o.items.forEach(i=>{if(prod(i.id))addToCart(i.id,i.qty);}); go('#/cart'); return;}
  /* --- admin --- */
  if(d.editProduct){productForm(d.editProduct);return;}
  if(d.delProduct){const p=prod(d.delProduct);confirmBox('Delete “'+p.name+'” from the store?',()=>{
    DB.products=DB.products.filter(x=>x.id!==d.delProduct);save();paint();toast('Product deleted');});return;}
  if(d.toggleProduct){const p=prod(d.toggleProduct);p.active=!p.active;save();paint();toast(p.active?'Now visible':'Hidden from website');return;}
  if(d.editCat){catForm(d.editCat);return;}
  if(d.delCat){confirmBox('Delete this category? Products stay, but lose their group.',()=>{
    DB.categories=DB.categories.filter(x=>x.id!==d.delCat);save();paint();toast('Category deleted');});return;}
  if(d.viewOrder){orderView(d.viewOrder);return;}
  if(d.advance){const o=DB.orders.find(x=>x.id===d.advance);const i=STEPS.indexOf(o.status);
    closeLayer(); setOrderStatus(o,STEPS[Math.min(i+1,2)]||'Processing').then(ok=>{if(ok)toast('Order marked '+o.status);});return;}
  if(d.cancelAdmin){const o=DB.orders.find(x=>x.id===d.cancelAdmin); closeLayer(); setOrderStatus(o,'Cancelled').then(ok=>{if(ok)toast('Order cancelled');});return;}
  if(d.msgRead){const m=API.messages.find(x=>x._key===d.msgRead); if(m){m.read=true;paint();
    API.call('/api/admin/item/'+encodeURIComponent(m._key),{method:'PATCH',admin:true,body:{read:true}});} return;}
  if(d.msgDel){confirmBox('Delete this message?',async()=>{ if(await deleteItem(d.msgDel)){API.messages=API.messages.filter(x=>x._key!==d.msgDel);paint();toast('Message deleted');} });return;}
  if(d.viewCust){const c=DB.customers.find(x=>x.id===d.viewCust);
    const his=DB.orders.filter(o=>o.email===c.email);
    openModal(c.name,`<p style="margin:0 0 10px;color:var(--muted);font-size:13.5px">${esc(c.email)} · ${esc(c.phone)} · ${esc(c.city)}</p>
      <div class="sumrow"><span>Orders</span><b>${c.orders}</b></div><div class="sumrow"><span>Lifetime spend</span><b>${money(c.spent)}</b></div>
      <div class="sumrow"><span>Customer since</span><b>${esc(c.joined)}</b></div>
      <h4 style="margin:14px 0 6px">Order history</h4>
      ${his.length?his.map(o=>`<div class="orow"><b>#${esc(o.id)}</b><span style="flex:1">${esc(o.date)}</span><b>${money(o.total)}</b>
        <span class="pill ${o.status==='Delivered'?'green':'amber'}">${esc(o.status)}</span></div>`).join(''):'<p style="color:var(--muted);font-size:13px">No orders stored in this store yet.</p>'}`,
      `<button class="btn btn-line btn-sq" data-close="1">Close</button>`);return;}
  if(d.stockSave){const inp=document.querySelector('[data-stock-in="'+d.stockSave+'"]');
    const p=prod(d.stockSave);p.stock=Math.max(0,+inp.value||0);save();paint();toast(p.name+' stock updated');return;}
  if(d.editBanner){bannerForm(d.editBanner);return;}
  if(d.delBanner){confirmBox('Delete this banner?',()=>{DB.banners=DB.banners.filter(x=>x.id!==d.delBanner);save();paint();toast('Banner deleted');});return;}
  if(d.toggleBanner){const b=DB.banners.find(x=>x.id===d.toggleBanner);b.active=!b.active;save();paint();return;}
  if(d.editCoupon){couponForm(d.editCoupon);return;}
  if(d.delCoupon){confirmBox('Delete this coupon?',()=>{DB.coupons=DB.coupons.filter(x=>x.id!==d.delCoupon);save();paint();toast('Coupon deleted');});return;}
  if(d.toggleCoupon){const k=DB.coupons.find(x=>x.id===d.toggleCoupon);k.active=!k.active;save();paint();return;}
  if(d.editBlog){blogForm(d.editBlog);return;}
  if(d.delBlog){confirmBox('Delete this post?',()=>{DB.blogs=DB.blogs.filter(x=>x.id!==d.delBlog);save();paint();toast('Post deleted');});return;}
  if(d.editPage){pageForm(d.editPage);return;}
  if(d.delPage){confirmBox('Delete this page?',()=>{DB.pages=DB.pages.filter(x=>x.id!==d.delPage);save();paint();toast('Page deleted');});return;}
  if(d.pubReview){
    const pend=(API.pendingReviews||[]).find(x=>x.id===d.pubReview);
    if(pend){ const {_key,_pending,...clean}=pend; clean.status='Published'; DB.reviews.unshift(clean); rateProduct(clean,1);
      API.pendingReviews=API.pendingReviews.filter(x=>x!==pend); save(); paint(); deleteItem(_key); toast('Review published on the website'); return; }
    const rv=DB.reviews.find(x=>x.id===d.pubReview); rv.status='Published'; rateProduct(rv,1); save();paint();toast('Review published');return;}
  if(d.hideReview){const rv=DB.reviews.find(x=>x.id===d.hideReview); rv.status='Pending'; rateProduct(rv,-1); save();paint();return;}
  if(d.delReview){confirmBox('Delete this review?',()=>{
    const pend=(API.pendingReviews||[]).find(x=>x.id===d.delReview);
    if(pend){ API.pendingReviews=API.pendingReviews.filter(x=>x!==pend); deleteItem(pend._key); paint(); return; }
    const rv=DB.reviews.find(x=>x.id===d.delReview); if(rv&&rv.status==='Published')rateProduct(rv,-1);
    DB.reviews=DB.reviews.filter(x=>x.id!==d.delReview);save();paint();});return;}
  if(d.delSub){const key=d.delSub; DB.subscribers=DB.subscribers.filter(x=>x.id!==key);save();paint();
    if(API.on&&/^sub:/.test(key))deleteItem(key); toast('Removed');return;}
  if(d.brand){DB.settings.theme=d.brand;save();paint();toast('Brand colour updated');return;}
  /* --- named actions --- */
  switch(d.act){
    case 'back': { closeLayer();
      if(NAV_DEPTH>0){NAV_DEPTH-=2;history.back();} else go(d.href||'#/'); break;}
    case 'sitemap': {
      const dom=(document.querySelector('[name="domain"]')||{}).value||'';
      if(!/^https?:\/\//.test(dom.trim())){toast('Add your website address first, like https://greenocean.in',true);break;}
      DB.settings.domain=dom.trim(); save();
      try{const a=document.createElement('a');
        a.href='data:application/xml;charset=utf-8,'+encodeURIComponent(sitemapXML(dom));
        a.download='sitemap.xml';a.click();toast('sitemap.xml downloaded');}
      catch(e){toast('Could not download here',true);}
      break;}
    case 'accountEdit': { const n=document.getElementById('accountName'); if(n){n.focus();n.select();} break; }
    case 'accountMenu': openModal('Account',`<div style="display:grid;gap:10px"><a class="btn btn-line btn-sq btn-block" href="#/orders" data-close="1">${ic('bag',16)} My orders</a><button class="btn btn-danger btn-sq btn-block" data-act="logout">Sign out</button></div>`,''); break;
    case 'cart': openCart(); break;
    case 'menu': openDrawer('Menu',`<form class="search" data-act="search" style="display:flex;max-width:none;margin:0 0 12px"><span>${ic('search',16)}</span>
        <input name="q" placeholder="Search plants, planters..." aria-label="Search products"></form>
      ${NAV_MAIN.map(n=>`<a class="mline" href="${n[1]}" data-close="1" style="${navOn(n[2])?'color:var(--green-700);font-weight:700':''}">${n[0]}</a>`).join('')}`,'','left');
      if(t.classList.contains('msearch')){const i=document.querySelector('.drawer .search input'); if(i)i.focus();} break;
    case 'admMenu': $('#side').classList.toggle('open'); break;
    case 'admLogout': adminSignOut();toast('Signed out of admin'); break;
    case 'eye': { const inp=t.parentElement.querySelector('input'); const show=inp.type==='password';
      inp.type=show?'text':'password'; t.innerHTML=ic(show?'eyeoff':'eye',18); t.setAttribute('aria-label',show?'Hide password':'Show password'); break; }
    case 'authTab': AUTH_TAB=d.tab||'pw'; OTP_SENT_EMAIL=''; paint(); break;
    case 'otpChangeEmail': e.preventDefault(); OTP_SENT_EMAIL=''; paint(); break;
    case 'forgot': e.preventDefault(); openModal('Reset your password',
      `<div class="field"><label>Email address</label><input class="inp" id="fpEmail" type="email" placeholder="Enter the email on your account"></div>
       <p style="margin:8px 0 0;font-size:12.5px;color:var(--muted)">We'll email you a link to set a new password. Signed up with only a mobile number? Message us on WhatsApp instead.</p>`,
      `<a class="btn btn-line btn-sq" target="_blank" rel="noopener" href="https://wa.me/${waNumber()}?text=${encodeURIComponent('Hi Green Ocean, I forgot my website password. My registered mobile number is ')}">${ic('phone',15)} WhatsApp</a>
       <button class="btn btn-primary btn-sq" id="fpSend">Send reset link</button>`);
      $('#fpSend').onclick=async()=>{
        const em=($('#fpEmail').value||'').trim(); const chk=RULES.email(em);
        if(chk!==true){toast(chk,true);return;}
        const btn=$('#fpSend'); btn.disabled=true; btn.textContent='Sending…';
        const res=await SB.resetPassword(em);
        btn.disabled=false; btn.textContent='Send reset link';
        if(!res.ok){toast(res.error,true);return;}
        closeLayer(); toast('Check your inbox for the reset link');};
      break;
    case 'socialLogin':
      if((d.p||'Google')==='Google'){ SB.signInWithGoogle(); break; }
      openModal('Continue with Apple',`<p style="margin:0;line-height:1.6">Apple sign-in isn't available yet. Please use email/mobile, OTP, or Google for now.</p>`,
        `<button class="btn btn-primary btn-sq" data-close="1">OK</button>`); break;
    case 'publishNow': schedulePublish(true); toast('Publishing to the live website…'); break;
    case 'contactAgain': paint(); break;
    case 'logout': SB.signOut();DB.afterLogin='';go('#/');toast('Signed out'); break;
    case 'applyFilter': {
      const p=new URLSearchParams();
      const g=n=>{const el=document.querySelector(`input[name="${n}"]:checked`);return el?el.value:'';};
      if(g('cat'))p.set('cat',g('cat')); if(g('max'))p.set('max',g('max')); if(g('sort'))p.set('sort',g('sort'));
      go('#/shop'+(p.toString()?'?'+p:'')); break;}
    case 'clearFilter': go('#/shop'); break;
    case 'applyCoupon': {
      e.preventDefault();
      const res=couponCheck($('#cpn').value);
      CPN_MSG=res.ok?res:{...res,code:($('#cpn').value||'').trim().toUpperCase()};
      if(res.ok){DB.coupon=res.code;save();}
      paint(); break;}
    case 'removeCoupon': DB.coupon='';CPN_MSG=null;save();paint(); break;
    case 'writeReview': {
      openModal('Write a review',`<form id="rForm" novalidate><div class="field"><label>Your name</label><input class="inp" name="name" data-v="name" data-label="Your name" placeholder="Enter your full name"></div>
        <div class="field"><label>Rating</label><select class="inp" name="rating">${[5,4,3,2,1].map(n=>`<option value="${n}">${n} star${n>1?'s':''}</option>`).join('')}</select></div>
        <div class="field"><label>Your review</label><textarea class="inp" name="text" data-v="text" data-label="Review" placeholder="How did your plant arrive?"></textarea></div>
        <input type="hidden" name="product" value="${esc(d.p)}"></form>`,
        `<button class="btn btn-line btn-sq" data-close="1">Cancel</button><button class="btn btn-primary btn-sq" id="rSave">Submit review</button>`);
      $('#rSave').onclick=async()=>{const f=$('#rForm'); if(!validateForm(f))return;
        const v=Object.fromEntries(new FormData(f).entries());
        if(API.on){ const btn=$('#rSave'); btn.disabled=true; btn.textContent='Sending…';
          const res=await API.call('/api/reviews',{method:'POST',body:{product:v.product,name:v.name,rating:+v.rating,text:v.text}});
          if(!res.ok){btn.disabled=false;btn.textContent='Submit review';toast(res.error,true);return;} }
        else DB.reviews.unshift({id:uid('r'),product:v.product,name:v.name,rating:+v.rating,text:v.text,date:today(),status:'Pending'});
        save();closeLayer();toast('Thank you, '+v.name.split(' ')[0]+'! Your review will appear once our team checks it.');};
      break;}
    case 'exportOrders': {
      const rows=[['Order','Customer','Phone','Total','Payment','Status','Date']].concat(
        DB.orders.map(o=>[o.id,o.name,o.phone,o.total,o.pay,o.status,o.date]));
      download('orders.csv',rows.map(r=>r.join(',')).join('\n')); break;}
    case 'exportSubs': download('subscribers.csv',DB.subscribers.map(s=>s.email).join('\n')); break;
    case 'launch': confirmBox('Remove all sample orders, customers, accounts, reviews and subscribers? Products, banners and pages stay.',()=>{
      DB.orders=[];DB.customers=[];DB.users=[];DB.reviews=[];DB.subscribers=[];DB.session=null;DB.cart=[];DB.wish=[];DB.coupon='';
      DB.products.forEach(p=>{p.rating=0;p.reviews=0;}); DB.counter=1001; DB.launched=true; save(); paint();
      toast('Sample data removed — your store is ready for real customers');}); break;
    case 'reset':
      if(API.on){ confirmBox('Throw away changes in this browser and load the live website data?',async()=>{
        const s=await API.call('/api/store'); if(s.ok&&s.store){applyStore(s.store);API.lastPub=pubString();API.status='live';paint();toast('Loaded the live website data');}
        else toast(s.error||'Nothing published yet',true);}); break; }
    case 'reset': confirmBox('Reset the whole store back to demo content?',()=>{resetAll();go('#/admin/dashboard');paint();toast('Store reset');}); break;
    case 'notif': openModal('Notifications',(API.messages||[]).filter(m=>!m.read).map(m=>
      `<div class="orow"><b>✉️</b><span style="flex:1">${esc(m.name)} sent a message</span><a class="link-more" href="#/admin/messages" data-close="1">Open</a></div>`).join('')+DB.orders.filter(o=>o.status==='Processing').map(o=>
      `<div class="orow"><b>#${esc(o.id)}</b><span style="flex:1">${esc(o.name)} placed an order</span><b>${money(o.total)}</b></div>`).join('')||
      '<div class="empty">Nothing new right now.</div>',`<button class="btn btn-line btn-sq" data-close="1">Close</button>`); break;
  }
});
function download(name,text){
  try{const a=document.createElement('a');
    a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(text);a.download=name;a.click();toast('Downloaded '+name);}
  catch(e){toast('Could not download here',true);}
}
function rateProduct(rv,dir){
  const p=DB.products.find(x=>x.name===rv.product); if(!p)return;
  const n=p.reviews||0, sum=(p.rating||0)*n + dir*rv.rating, m=Math.max(0,n+dir);
  p.reviews=m; p.rating=m?Math.round(sum/m*10)/10:0;
}
async function submitOrderLive(f){
  const d=Object.fromEntries(new FormData(f).entries());
  const wa=DB.settings.orderMode==='whatsapp';
  const btn=f.querySelector('button[type="submit"]'), label=btn.innerHTML;
  btn.disabled=true; btn.innerHTML='Placing your order…'; $('#coErr').innerHTML='';
  const win=wa?window.open('','_blank'):null;
  const res=await API.call('/api/orders',{method:'POST',body:{...d,coupon:DB.coupon||'',via:wa?'WhatsApp':'Website',
    items:DB.cart.map(l=>{const p=prod(l.id);return{id:l.id,qty:l.qty,name:p&&p.name,price:p&&p.price,art:p&&p.art};})}});
  if(!res.ok){ if(win)win.close(); btn.disabled=false; btn.innerHTML=label;
    $('#coErr').innerHTML=`<div class="form-err" role="alert">${esc(res.error)}</div>`; $('#coErr').scrollIntoView({block:'center'}); return; }
  const id=placeOrder(f,res);
  const o=DB.orders.find(x=>x.id===id);
  if(win&&o){ try{ win.location.href=orderWhatsAppLink(o); }catch(e){} }
}
/* ---------- change events ---------- */
document.addEventListener('change',e=>{
  if(e.target.type==='checkbox'&&e.target.dataset.v)markField(e.target);
  if(e.target.dataset.range){DASH_RANGE=+e.target.value;paint();return;}
  const st=e.target.dataset.status;
  if(st){const o=DB.orders.find(x=>x.id===st); const val=e.target.value;
    if(val==='Cancelled'&&!o._key)o.items.forEach(i=>{const p=prod(i.id);if(p)p.stock+=i.qty;});
    setOrderStatus(o,val).then(ok=>{if(ok)toast('Order #'+st+' is now '+val);});}
});
/* ---------- form submits ---------- */
document.addEventListener('submit',async e=>{
  const f=e.target, act=f.dataset.act;
  if(act==='search'){e.preventDefault();const q=new FormData(f).get('q');go('#/shop?q='+encodeURIComponent(q||''));return;}
  if(act==='admSearch'){e.preventDefault();const q=new FormData(f).get('q');go('#/admin/products?q='+encodeURIComponent(q||''));return;}
  if(act==='subscribe'){e.preventDefault(); if(!validateForm(f))return; const em=new FormData(f).get('email').trim().toLowerCase();
    const who=(DB.session&&DB.session.name)||em.split('@')[0].replace(/[^a-z]/gi,' ').trim()||'friend';
    const done=()=>{ const box=f.parentElement; f.remove(); box.insertAdjacentHTML('beforeend',thankYouCard(who,em,'news')); };
    if(API.on){ const b=f.querySelector('button'); b.disabled=true; b.textContent='Joining…';
      API.call('/api/subscribe',{method:'POST',body:{email:em}}).then(res=>{
        if(!res.ok){b.disabled=false;b.textContent='Subscribe';toast(res.error,true);return;}
        done(); }); return; }
    if(!DB.subscribers.some(s=>s.email===em))DB.subscribers.unshift({id:uid('s'),email:em,date:today()});
    save(); done(); return;}
  if(act==='contactForm'){e.preventDefault(); if(!validateForm(f))return;
    const d=Object.fromEntries(new FormData(f).entries());
    const text=`Message from ${location.host||'greenocean.co.in'}\nName: ${d.name}\nEmail: ${d.email}\nMobile: ${d.phone}\n\n${d.msg}`;
    const via=(e.submitter&&e.submitter.dataset.via)||(API.on?'api':'wa');
    if(via==='api'){ const b=f.querySelector('[data-via="api"]'); b.disabled=true; b.innerHTML='Sending…';
      API.call('/api/contact',{method:'POST',body:d}).then(res=>{
        if(!res.ok){ b.disabled=false; b.innerHTML='Send message'; toast(res.error,true); return; }
        f.outerHTML=thankYouCard(d.name,d.email,'contact'); window.scrollTo({top:0,behavior:'smooth'}); });
      return; }
    if(via==='mail') location.href='mailto:'+DB.settings.email+'?subject='+encodeURIComponent('Website enquiry from '+d.name)+'&body='+encodeURIComponent(text);
    else window.open('https://wa.me/'+waNumber()+'?text='+encodeURIComponent(text),'_blank','noopener');
    f.reset(); f.querySelectorAll('.inp').forEach(i=>i.classList.remove('good','bad'));
    toast(via==='mail'?'Your email app is opening — press send there':'WhatsApp is opening — press send there');return;}
  if(act==='campaign'){e.preventDefault(); if(!validateForm(f))return; f.reset();toast('Campaign saved as a draft');return;}
  if(f.id==='admForm'){e.preventDefault(); if(!validateForm(f))return; const d=Object.fromEntries(new FormData(f).entries());
    if(API.on){
      if(d.user.trim().toLowerCase()!=='admin'){toast('Username or password is wrong',true);return;}
      const b=f.querySelector('button[type="submit"]'); b.disabled=true; b.textContent='Checking…';
      API.key=d.pass;
      API.call('/api/admin/check',{method:'POST',admin:true,body:{}}).then(res=>{
        b.disabled=false; b.textContent='Sign in';
        if(!res.ok){ API.key=null; toast(res.status===503?'Admin password is not set in Cloudflare yet (ADMIN_PASSWORD).':'Username or password is wrong',true); return; }
        try{sessionStorage.setItem('go_admin_key',d.pass);}catch(e){}
        DB.admin=true; save(); go('#/admin/dashboard'); paint(); loadInbox(true); toast('Welcome back');
        if(API.storeMissing)schedulePublish(true); });
      return; }
    if(d.user.trim().toLowerCase()==='admin'&&d.pass===DB.settings.adminPass){
      DB.admin=true;save();go('#/admin/dashboard');paint();toast('Welcome back');}
    else toast('Username or password is wrong',true);
    return;}
  if(f.id==='coForm'){e.preventDefault(); if(!validateForm(f))return;
    if(API.on){ submitOrderLive(f); return; }
    const id=placeOrder(f);
    if(DB.settings.orderMode==='whatsapp'){const o=DB.orders.find(x=>x.id===id); if(o)window.open(orderWhatsAppLink(o),'_blank','noopener');}
    return;}
  if(f.id==='suForm'){e.preventDefault(); if(!validateForm(f))return;
    const d=Object.fromEntries(new FormData(f).entries());
    const btn=f.querySelector('button[type="submit"]'),label=btn.innerHTML; btn.disabled=true; btn.innerHTML='Creating account…';
    const res=await SB.signUp({name:d.name.trim(),email:d.email.trim().toLowerCase(),phone:d.phone,pass:d.pass});
    btn.disabled=false; btn.innerHTML=label;
    if(!res.ok){toast(res.error,true); if(/already has an account/.test(res.error))go('#/login'); return;}
    if(res.needsConfirm){ openModal('Confirm your email',`<p style="margin:0;line-height:1.6">We've sent a confirmation link to <b>${esc(d.email)}</b>. Please open it, then come back and sign in.</p>`,
      `<button class="btn btn-primary btn-sq" data-close="1">OK</button>`); go('#/login'); return; }
    return;}
  if(f.id==='liForm'){e.preventDefault(); if(!validateForm(f))return;
    const d=Object.fromEntries(new FormData(f).entries());
    const btn=f.querySelector('button[type="submit"]'),label=btn.innerHTML; btn.disabled=true; btn.innerHTML='Signing in…';
    if(!d.remember)DB.sessionTemp=true;
    const res=await SB.signIn({login:d.email,pass:d.pass});
    btn.disabled=false; btn.innerHTML=label;
    if(!res.ok){toast(res.error,true);return;}
    try{sessionStorage.setItem('go_sess','1');}catch(e){}
    return;}
  if(f.id==='otpForm'){e.preventDefault();
    const d=Object.fromEntries(new FormData(f).entries());
    const btn=f.querySelector('button'),label=btn.innerHTML;
    if(!OTP_SENT_EMAIL){
      const chk=RULES.email(d.email); if(chk!==true){toast(chk,true);return;}
      btn.disabled=true; btn.innerHTML='Sending…';
      const res=await SB.sendOtp(d.email.trim().toLowerCase());
      btn.disabled=false; btn.innerHTML=label;
      if(!res.ok){toast(res.error,true);return;}
      OTP_SENT_EMAIL=d.email.trim().toLowerCase(); paint(); toast('Code sent — check your email'); return;
    }
    if(!/^[0-9]{6}$/.test((d.token||'').trim())){toast('Enter the 6-digit code',true);return;}
    btn.disabled=true; btn.innerHTML='Verifying…';
    const res=await SB.verifyOtp(OTP_SENT_EMAIL,d.token.trim());
    btn.disabled=false; btn.innerHTML=label;
    if(!res.ok){toast(res.error,true);return;}
    OTP_SENT_EMAIL=''; try{sessionStorage.setItem('go_sess','1');}catch(e){}
    return;}
  if(f.id==='acForm'){e.preventDefault(); if(!validateForm(f))return;
    const d=Object.fromEntries(new FormData(f).entries());
    const btn=f.querySelector('button'),label=btn.innerHTML; btn.disabled=true; btn.innerHTML='Saving…';
    const res=await SB.updateProfile({name:d.name,phone:d.phone,address:d.address,city:d.city,pin:d.pin});
    btn.disabled=false; btn.innerHTML=label;
    if(!res.ok){toast(res.error,true);return;}
    Object.assign(DB.session,{name:d.name,phone:d.phone,address:d.address,city:d.city,pin:d.pin});
    const c=DB.customers.find(x=>x.email===DB.session.email); if(c){c.name=d.name;c.phone=d.phone;c.city=d.city;}
    save();paint();toast('Details saved');return;}
  if(f.id==='pwForm'){e.preventDefault(); if(!validateForm(f))return;
    const d=Object.fromEntries(new FormData(f).entries());
    const btn=f.querySelector('button'),label=btn.innerHTML; btn.disabled=true; btn.innerHTML='Updating…';
    const res=await SB.updatePassword(d.pass,d.oldpass);
    btn.disabled=false; btn.innerHTML=label;
    if(!res.ok){toast(res.error,true);return;}
    f.reset(); f.querySelectorAll('.inp').forEach(i=>i.classList.remove('good','bad'));
    toast('Password updated');return;}
  if(f.id==='setForm'){e.preventDefault(); if(!validateForm(f))return;const d=Object.fromEntries(new FormData(f).entries());
    Object.assign(DB.settings,{store:d.store,tag:d.tag,email:d.email,phone:d.phone,address:d.address,gst:d.gst,
      freeShipAbove:+d.freeShipAbove,shipFee:+d.shipFee,upiEnabled:!!d.upiEnabled,cardEnabled:!!d.cardEnabled,codEnabled:!!d.codEnabled,
      metaTitle:d.metaTitle,metaDesc:d.metaDesc,domain:(d.domain||'').trim(),orderMode:d.orderMode==='online'?'online':'whatsapp',
      instagram:(d.instagram||'').trim(),facebook:(d.facebook||'').trim(),youtube:(d.youtube||'').trim()});
    save();paint();toast('Settings saved');return;}
  if(f.id==='appForm'){e.preventDefault(); if(!validateForm(f))return;const d=Object.fromEntries(new FormData(f).entries());
    Object.assign(DB.settings,{heroKicker:d.heroKicker,heroTitle:d.heroTitle,heroSub:d.heroSub});
    if(DB.banners[0])DB.banners[0].title=d.heroTitle;
    save();paint();toast('Homepage updated');return;}
  if(f.id==='accForm'){e.preventDefault(); if(!validateForm(f))return;const d=Object.fromEntries(new FormData(f).entries());
    DB.settings.adminEmail=d.adminEmail;DB.settings.adminPass=d.adminPass;save();toast('Admin login updated');return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLayer();
  if(e.key==='Enter'&&e.target&&e.target.id==='cpn'){e.preventDefault();const b=document.querySelector('[data-act="applyCoupon"]');if(b)b.click();}});
document.addEventListener('input',e=>{ if(e.target&&e.target.id==='cpn'&&CPN_MSG){ CPN_MSG=null; const m=document.getElementById('cpnMsg'); if(m){m.textContent='';m.className='cpn-msg';} e.target.classList.remove('bad'); } });
/* ---------- boot ---------- */
load(); paint(); API.init(); SB.init();
</script>
</body>
</html>
