<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found</title>
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#f7faf8;
  }
  body{overflow:hidden}
  .error-page{
    width:100vw;
    height:100vh;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:#f7faf8;
  }
  .artwork{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
    user-select:none;
    -webkit-user-drag:none;
  }
  /* The source artwork is 1536 × 748. At that aspect ratio this is pixel-for-pixel. */
  @media (min-aspect-ratio: 1536/748){
    .artwork{width:100%;height:auto}
  }
  @media (max-aspect-ratio: 1536/748){
    .artwork{width:auto;height:100%}
  }
</style>
</head>
<body>
  <main class="error-page">
    <img
      class="artwork"
      src="./404-reference.png"
      width="1536"
      height="748"
      alt="404 Page Not Found"
      draggable="false"
    >
  </main>
</body>
</html>
